apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: ticket-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      # Booking is the orchestrator: it calls Seat, Payment and Notification, so it
      # must not accept traffic until MySQL and all three of those are already
      # reachable - the same ordering docker-compose.yml expresses with depends_on.
      initContainers:
        - name: wait-for-mysql
          image: mysql:8
          command:
            - sh
            - -c
            - until mysqladmin ping -h mysql -uroot -prootpass --silent; do echo waiting for mysql; sleep 2; done
        - name: wait-for-seat-service
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O- http://seat-service:8002/health; do echo waiting for seat-service; sleep 2; done"]
        - name: wait-for-payment-service
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O- http://payment-service:8003/health; do echo waiting for payment-service; sleep 2; done"]
        - name: wait-for-notification-service
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O- http://notification-service:8004/health; do echo waiting for notification-service; sleep 2; done"]
      containers:
        - name: booking-service
          image: ticket-booking/booking-service:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8001"
            - name: DB_URL
              value: mysql+pymysql://booking_user:booking_pass@mysql:3306/booking_db
            - name: SEAT_SERVICE_URL
              value: http://seat-service:8002
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8003
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8004
            - name: HOLD_SECONDS
              value: "30"
            - name: SEAT_PRICE
              value: "250.00"
            - name: MAX_SEATS_PER_BOOKING
              value: "6"
            - name: SERVICE_TIMEOUT_SECONDS
              value: "3"
            - name: PAYMENT_TIMEOUT_SECONDS
              value: "8"
            - name: PAY_LOCK_TTL_SECONDS
              value: "60"
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: ticket-booking
spec:
  type: NodePort   # externally reachable via `minikube service booking-service -n ticket-booking`
  selector:
    app: booking-service
  ports:
    - port: 8001
      targetPort: 8001
