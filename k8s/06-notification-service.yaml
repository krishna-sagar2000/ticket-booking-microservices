apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ticket-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        - name: wait-for-mysql
          image: mysql:8
          command:
            - sh
            - -c
            - until mysqladmin ping -h mysql -uroot -prootpass --silent; do echo waiting for mysql; sleep 2; done
      containers:
        - name: notification-service
          image: ticket-booking/notification-service:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8004"
            - name: DB_URL
              value: mysql+pymysql://notification_user:notification_pass@mysql:3306/notification_db
          ports:
            - containerPort: 8004
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ticket-booking
spec:
  selector:
    app: notification-service
  ports:
    - port: 8004
      targetPort: 8004
