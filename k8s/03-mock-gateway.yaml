apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-gateway
  namespace: ticket-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-gateway
  template:
    metadata:
      labels:
        app: mock-gateway
    spec:
      containers:
        - name: mock-gateway
          image: ticket-booking/mock-gateway:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8005"
          ports:
            - containerPort: 8005
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mock-gateway
  namespace: ticket-booking
spec:
  selector:
    app: mock-gateway
  ports:
    - port: 8005
      targetPort: 8005
