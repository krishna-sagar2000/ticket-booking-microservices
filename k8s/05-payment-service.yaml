apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ticket-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      initContainers:
        - name: wait-for-mysql
          image: mysql:8
          command:
            - sh
            - -c
            - until mysqladmin ping -h mysql -uroot -prootpass --silent; do echo waiting for mysql; sleep 2; done
      containers:
        - name: payment-service
          image: ticket-booking/payment-service:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8003"
            - name: DB_URL
              value: mysql+pymysql://payment_user:payment_pass@mysql:3306/payment_db
            - name: GATEWAY_URL
              value: http://mock-gateway:8005
            - name: GATEWAY_TIMEOUT_SECONDS
              value: "5"
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ticket-booking
spec:
  selector:
    app: payment-service
  ports:
    - port: 8003
      targetPort: 8003
