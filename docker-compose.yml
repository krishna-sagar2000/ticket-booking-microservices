# Ticket Booking Microservices - full stack (Assignment 2).
#
# Brings up one MySQL instance (four databases, four users - see scripts/db/init.sql)
# and all five application services, each built from its own Dockerfile.
#
# Usage (from the repository root):
#   cp .env.example .env            # first time only; edit MYSQL_ROOT_PASSWORD if you like
#   docker compose up --build
#
# All application configuration (DB_URL, service URLs, timeouts, ports) is supplied
# through environment variables below - nothing is hard-coded in the images, and no
# .env file or password is baked into any image (see each service's .dockerignore).
#
# Stop everything:            docker compose down
# Stop and wipe the database: docker compose down -v
# Logs for one service:       docker compose logs -f booking-service
# Health/status of all:       docker compose ps

services:
  # ------------------------------------------------------------------ database
  mysql:
    image: mysql:8
    container_name: ticket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping only succeeds once the server is actually accepting connections,
      # which is also after init.sql has had a chance to run on a fresh volume.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # ------------------------------------------------------------------ mock gateway
  # No database of its own. Started before Payment so Payment's first request has
  # something to call.
  mock-gateway:
    build:
      context: ./services/mock-gateway
    image: ticket-booking/mock-gateway:1.0
    container_name: mock-gateway
    restart: unless-stopped
    environment:
      PORT: 8005
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------------ seat service
  seat-service:
    build:
      context: ./services/seat-service
    image: ticket-booking/seat-service:1.0
    container_name: seat-service
    restart: unless-stopped
    environment:
      PORT: 8002
      DB_URL: mysql+pymysql://seat_user:seat_pass@mysql:3306/seat_db
      HOLD_SECONDS: ${HOLD_SECONDS:-30}
      EXPIRY_INTERVAL_SECONDS: ${EXPIRY_INTERVAL_SECONDS:-5}
    ports:
      - "8002:8002"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------ payment service
  payment-service:
    build:
      context: ./services/payment-service
    image: ticket-booking/payment-service:1.0
    container_name: payment-service
    restart: unless-stopped
    environment:
      PORT: 8003
      DB_URL: mysql+pymysql://payment_user:payment_pass@mysql:3306/payment_db
      GATEWAY_URL: http://mock-gateway:8005
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-5}
    ports:
      - "8003:8003"
    depends_on:
      mysql:
        condition: service_healthy
      mock-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------ notification service
  notification-service:
    build:
      context: ./services/notification-service
    image: ticket-booking/notification-service:1.0
    container_name: notification-service
    restart: unless-stopped
    environment:
      PORT: 8004
      DB_URL: mysql+pymysql://notification_user:notification_pass@mysql:3306/notification_db
    ports:
      - "8004:8004"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------ booking service (orchestrator)
  # Depends on every other service being healthy first, since it is the one that calls them.
  booking-service:
    build:
      context: ./services/booking-service
    image: ticket-booking/booking-service:1.0
    container_name: booking-service
    restart: unless-stopped
    environment:
      PORT: 8001
      DB_URL: mysql+pymysql://booking_user:booking_pass@mysql:3306/booking_db
      SEAT_SERVICE_URL: http://seat-service:8002
      PAYMENT_SERVICE_URL: http://payment-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      HOLD_SECONDS: ${HOLD_SECONDS:-30}
      SEAT_PRICE: ${SEAT_PRICE:-250.00}
      MAX_SEATS_PER_BOOKING: ${MAX_SEATS_PER_BOOKING:-6}
      SERVICE_TIMEOUT_SECONDS: ${SERVICE_TIMEOUT_SECONDS:-3}
      PAYMENT_TIMEOUT_SECONDS: ${PAYMENT_TIMEOUT_SECONDS:-8}
      PAY_LOCK_TTL_SECONDS: ${PAY_LOCK_TTL_SECONDS:-60}
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
      seat-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
